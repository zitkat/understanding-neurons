[project]
name = "understanding-neurons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~= 3.13.0"
dependencies = [
    "matplotlib ~= 3.10.3",
    "numpy ~= 2.3.1",
    "pandas ~= 2.3.0",
    "pillow ~= 11.2.1",
    "scikit-learn ~= 1.7.0",
    "seaborn ~= 0.13.2",
    "tqdm ~= 4.67.1",
]

[project.optional-dependencies]
torch = [
    "timm ~= 1.0.15",
    "torch ~= 2.7.1",
    "torch-lucent",
]

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.uv.sources]
torch-lucent = { git = "https://github.com/zitkat/lucent.git", rev = "mymaster" }
